<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chob Calendar - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background-color: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading.show {
            display: block;
        }

        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6b7280;
        }

        .footer-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 4px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .debug-info {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 12px;
            margin-top: 20px;
            font-size: 12px;
            color: #6b7280;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Chob Calendar</h1>
            <p>管理后台登录</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="请输入邮箱"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="请输入密码"
                    required
                >
            </div>

            <div class="remember-me">
                <input 
                    type="checkbox" 
                    id="rememberMe" 
                    name="rememberMe"
                >
                <label for="rememberMe">7天内记住我</label>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">登录</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 8px;">登录中...</p>
            </div>
        </form>

        <div class="footer-links">
            <a href="#forgot-password">忘记密码?</a>
            <span>|</span>
            <a href="#register">需要账户?</a>
        </div>

        <!-- 调试信息（开发时用）-->
        <div class="debug-info">
            <strong>调试信息:</strong>
            <div id="debugInfo">连接中...</div>
        </div>
    </div>

    <!-- Supabase JS库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ========================================
        // 1. 初始化 Supabase 客户端
        // ========================================
        
        // 这里填入你的 Supabase 凭证
        const SUPABASE_URL = 'https://fzkspluioupfjzqidxpy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GXcuzNytMpc2Lg9v_lA8gQ_lzwLL6pB';

        // 创建Supabase客户端
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 调试：输出连接状态
        console.log('Supabase 客户端已初始化');
        console.log('URL:', SUPABASE_URL);
        updateDebugInfo('✅ Supabase 客户端已初始化');

        // ========================================
        // 2. 处理登录表单提交
        // ========================================

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // 清空之前的消息
            clearMessages();
            showLoading(true);

            try {
                // 调用 Supabase Auth 登录
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    // 登录失败
                    throw error;
                }

                // 登录成功！
                const user = data.user;
                const session = data.session;

                updateDebugInfo(`✅ 登录成功！用户ID: ${user.id}`);
                showSuccess(`登录成功！欢迎 ${email}`);

                // 如果用户勾选了"记住我"
                if (rememberMe) {
                    // 设置7天的localStorage标记
                    const expiresAt = new Date();
                    expiresAt.setDate(expiresAt.getDate() + 7);
                    
                    localStorage.setItem('rememberMe', 'true');
                    localStorage.setItem('rememberMeExpires', expiresAt.getTime());
                    localStorage.setItem('userEmail', email);
                }

                // 保存用户信息到localStorage
                localStorage.setItem('supabaseSession', JSON.stringify(session));
                localStorage.setItem('userId', user.id);

                // 2秒后跳转到后台首页
                setTimeout(() => {
                    window.location.href = '/admin-dashboard.html';
                }, 2000);

            } catch (error) {
                updateDebugInfo(`❌ 登录错误: ${error.message}`);
                
                // 显示友好的错误信息
                if (error.message.includes('Invalid login credentials')) {
                    showError('邮箱或密码错误');
                } else if (error.message.includes('Email not confirmed')) {
                    showError('请先验证你的邮箱地址');
                } else if (error.message.includes('User account is disabled')) {
                    showError('账户已被禁用，如有疑问请联系管理员');
                } else {
                    showError(`登录失败: ${error.message}`);
                }
            } finally {
                showLoading(false);
            }
        });

        // ========================================
        // 3. 辅助函数
        // ========================================

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('show');
        }

        function clearMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        function showLoading(show) {
            const loading = document.getElementById('loading');
            const btn = document.getElementById('loginBtn');
            
            if (show) {
                loading.classList.add('show');
                btn.disabled = true;
            } else {
                loading.classList.remove('show');
                btn.disabled = false;
            }
        }

        function updateDebugInfo(message) {
            const debugInfo = document.getElementById('debugInfo');
            debugInfo.textContent = message;
            console.log(message);
        }

        // ========================================
        // 4. 页面加载时检查是否已登录
        // ========================================

        window.addEventListener('load', async () => {
            const session = localStorage.getItem('supabaseSession');
            
            if (session) {
                const sessionData = JSON.parse(session);
                updateDebugInfo(`✅ 检测到已登录会话，用户: ${sessionData.user.email}`);
                
                // 检查"记住我"是否过期
                const rememberMe = localStorage.getItem('rememberMe');
                const rememberMeExpires = localStorage.getItem('rememberMeExpires');
                
                if (rememberMe && rememberMeExpires) {
                    const now = new Date().getTime();
                    const expires = parseInt(rememberMeExpires);
                    
                    if (now < expires) {
                        // 仍然有效，可以自动登录
                        updateDebugInfo('✅ 记住我仍有效，可以自动跳转到后台');
                        // 这里可以选择自动跳转或让用户点击
                    } else {
                        // 已过期，清除记住我
                        localStorage.removeItem('rememberMe');
                        localStorage.removeItem('rememberMeExpires');
                        updateDebugInfo('⚠️ 记住我已过期，需要重新登录');
                    }
                }
            } else {
                updateDebugInfo('📝 未登录，请输入邮箱和密码');
            }
        });

        // ========================================
        // 5. 测试账户信息（用于开发测试）
        // ========================================
        console.log('=== 测试说明 ===');
        console.log('现在还没有用户账户，你需要先在Supabase中创建用户');
        console.log('可以在 Authentication > Users > Add user 中手动创建');
        console.log('或者通过注册流程创建');
    </script>
</body>
</html>
